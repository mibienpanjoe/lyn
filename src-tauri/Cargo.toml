[package]
name = "lyn"
version = "0.1.0"
description = "A local-first desktop working-memory companion"
authors = ["Lyn contributors"]
license = "MIT"
edition = "2024"
default-run = "lyn"

[lib]
name = "lyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
hound = "3.5"
png = "0.18"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "recording", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-global-shortcut = "2.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
